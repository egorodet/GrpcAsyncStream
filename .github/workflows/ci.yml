name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job configures, builds and tests with a preset of CMakePresets.json.
#
# The conan-* presets take the external dependencies (gRPC, protobuf, Abseil,
# magic_enum, Catch2) from Conan (conanfile.py): the cmake-conan provider
# (cmake/conan_provider.cmake) runs `conan install` during the configure step, with
# a host profile derived from the CMake toolchain. Conan Center has no prebuilt C++20
# binaries of gRPC and Abseil, so the first run of each dependency set builds them;
# the Conan package cache then makes every later run skip that build completely.
#
# Each job's dependency set is identified by `deps`: jobs with the same set share one
# cache entry. The dependencies are always Release packages: conan-relwithsanitizers
# builds this project as RelWithDebInfo (with assertions) over the Release packages,
# so the sanitizer job of a platform shares the dependencies of its release job.
# conan-coverage (a Debug build with --coverage) likewise shares the Linux GCC packages
# and uploads its report to Codecov.

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            deps: linux-gcc
            cc: gcc
            cxx: g++
            preset: conan-release
          - name: Linux GCC Coverage
            os: ubuntu-latest
            deps: linux-gcc
            cc: gcc
            cxx: g++
            preset: conan-coverage
            coverage: true
          - name: Linux Clang + ASan/UBSan/LSan
            os: ubuntu-latest
            deps: linux-clang
            cc: clang
            cxx: clang++
            preset: conan-relwithsanitizers
          - name: macOS Apple Clang
            os: macos-latest
            deps: macos-apple-clang
            preset: conan-release
          - name: macOS Apple Clang + ASan/UBSan
            os: macos-latest
            deps: macos-apple-clang
            preset: conan-relwithsanitizers
          - name: Windows MSVC
            os: windows-latest
            deps: windows-msvc
            preset: conan-release
          - name: Windows MSVC + ASan
            os: windows-latest
            deps: windows-msvc
            preset: conan-relwithsanitizers

    env:
      # Benchmarks in CI only check the bounded-memory assertions; keep them short
      GRPC_ASYNC_STREAM_BENCH_MESSAGES: 10000

    defaults:
      run:
        shell: bash # with pipefail on every platform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Compilers for the build and, through the provider's profile, for Conan (Linux only;
      # others use the default)
      - name: Select compiler
        if: matrix.cxx
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Install Conan
        id: conan
        run: |
          pip install "conan>=2.9,<3"
          conan profile detect --force
          conan profile show
          # The detected profile (compiler, version, runtime, ...) is part of the cache key,
          # so a runner image update starts a new cache instead of rebuilding on every run
          echo "profile-hash=$(conan profile show --format=json | python -c 'import hashlib,sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:16])')" >> "$GITHUB_OUTPUT"

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore Conan packages
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.deps }}-${{ steps.conan.outputs.profile-hash }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ matrix.deps }}-${{ steps.conan.outputs.profile-hash }}-

      # Also installs the dependencies with Conan (building the missing ones)
      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} | tee configure.log
          # Every dependency must come from Conan, none from CPM
          if grep -E "CPM: Adding package|using fetched" configure.log; then
            echo "::error::A dependency was fetched with CPM instead of using the Conan package"
            exit 1
          fi

      # Keep only finished packages: build trees and sources would blow the cache quota
      - name: Save Conan packages
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: conan cache clean "*" --source --build --download --temp

      - uses: actions/cache/save@v4
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.deps }}-${{ steps.conan.outputs.profile-hash }}-${{ hashFiles('conanfile.py') }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit and integration tests
        run: ctest --preset ${{ matrix.preset }}

      - name: Heavy-load benchmark (memory bounds)
        if: ${{ !matrix.coverage }}
        run: ctest --preset ${{ matrix.preset }}-benchmarks

      # Filters and options come from gcovr.cfg; gcov is the one of the default GCC
      - name: Coverage report
        if: matrix.coverage
        run: |
          pip install "gcovr>=8,<9"
          gcovr build-${{ matrix.preset }} --cobertura coverage.xml

      # Pull requests from forks have no secrets and rely on Codecov's tokenless upload,
      # which may be rate-limited, so only failures of this repository's uploads fail the job
      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: tests
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # The CPM path (no package manager) stays covered by one job; ccache keeps its
  # gRPC source build fast after the first run.
  cpm-fallback:
    name: Linux GCC (CPM)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpm-fallback
          max-size: 2G

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake --preset cpm-release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset cpm-release

      - name: Unit and integration tests
        run: ctest --preset cpm-release
