name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            build_type: Release
            sanitizers: OFF
          - name: Linux Clang + ASan/UBSan/LSan
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: ON
          - name: macOS Apple Clang
            os: macos-latest
            build_type: Release
            sanitizers: OFF
          - name: macOS Apple Clang + ASan/UBSan
            os: macos-latest
            build_type: Debug
            sanitizers: ON
          - name: Windows MSVC
            os: windows-latest
            build_type: Release
            sanitizers: OFF
          - name: Windows MSVC + ASan
            os: windows-latest
            # Release: sccache cannot cache objects built with /Zi debug information
            build_type: Release
            sanitizers: ON

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      # Benchmarks in CI only check the bounded-memory assertions; keep them short
      GRPC_ASYNC_STREAM_BENCH_MESSAGES: 10000

    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      # gRPC is built from source; the compiler cache makes later runs fast
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          max-size: 2G
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            LAUNCHER=sccache
            COMPILERS="-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl"
          else
            LAUNCHER=ccache
            COMPILERS=""
            if [ -n "${{ matrix.cxx }}" ]; then
              COMPILERS="-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}"
            fi
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=$LAUNCHER \
            -DCMAKE_CXX_COMPILER_LAUNCHER=$LAUNCHER \
            -DGRPC_ASYNC_STREAM_GRPC_PROVIDER=fetch \
            -DGRPC_ASYNC_STREAM_ENABLE_SANITIZERS=${{ matrix.sanitizers }} \
            $COMPILERS

      - name: Build
        run: cmake --build build --parallel

      - name: Unit and integration tests
        run: ctest --test-dir build -LE benchmark --output-on-failure --timeout 300

      - name: Heavy-load benchmark (memory bounds)
        run: ctest --test-dir build -L benchmark --output-on-failure
