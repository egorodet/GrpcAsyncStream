# gcovr settings for coverage reports of the *-coverage presets (run from the project root):
#   gcovr build-conan-coverage
# Only the library and test utility headers are measured, not the tests themselves.
root = .
filter = include/
filter = tests/include/
exclude-throw-branches = yes
exclude-unreachable-branches = yes
# One result per source line, whatever the number of template instances
merge-lines = yes
print-summary = yes
